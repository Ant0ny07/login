<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina de login</title>
    <style>
       
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-image: linear-gradient(45deg, rgb(0, 255, 213) ,rgb(238, 235, 235),rgb(29, 194, 7) ); 
            
        
        }
        div{
            background-image: linear-gradient(45deg,gray,black);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            padding: 100PX;
                border-radius:20px; 

                }
                h1{
                    padding: 10px;
                    color:white ;
                    font-size: 50px;
                }
                input{
                    font-size: 20px;
                    outline: none;
                    padding: 10px;
                }
                button{
                    padding: 10px;
                    font-size: 20px;
                    width: 100%;
                  background-image: linear-gradient(50deg,black,gray);
                  color: aliceblue;
                  cursor: pointer;

                
                }
            button:hover{
                background-image: linear-gradient(rgb(68, 211, 12),rgb(13, 139, 211));
            }
         

    </style>
</head>
<body>
 <div>
    <h1>Login</h1>
    <input type="text" placeholder="nome">
    <br><br>
    <input type="password" placeholder="senha">
    <br><br>
    <button>entra</button>
    
 </div>


  
</body>
</html>
